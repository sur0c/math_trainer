<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Перетаскиваемые квадраты с ручной сортировкой</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; background-color: #f0f0f0;
            font-family: Arial, sans-serif; overflow: hidden;
            height: 100%; touch-action: none;
        }
        .container { position: relative; width: 100%; height: 100%; }
        .tray {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 6px; max-width: calc(100vw - 20px);
            z-index: 100; pointer-events: none;
        }
        .tray > * { pointer-events: auto; }
        .stage {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: stretch;
            gap: 12px; width: max-content; max-width: calc(100vw - 20px);
            pointer-events: none;
        }
        .stage > * { pointer-events: auto; }
        .calc-row { display: flex; justify-content: flex-start; padding-left: 0; }
        .calc-button {
            background-color: #b0b0b0; color: white; border: none;
            border-radius: 8px; padding: 10px 20px; font-size: 16px;
            font-weight: bold; font-family: Arial, sans-serif; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s; white-space: nowrap;
        }
        .calc-button:hover { background-color: #999; }
        .calc-button:active { background-color: #808080; }
        .drop-zone {
            min-width: 600px; width: max-content; max-width: 100%;
            height: 200px; border: 2px dashed #999; border-radius: 12px;
            background-color: rgba(255,255,255,0.4);
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 20px; box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .drop-zone.active {
            border-color: #4a90e2;
            background-color: rgba(74,144,226,0.1);
        }
        .drop-zone .placeholder { color: #999; font-size: 14px; user-select: none; }
        .calc-result {
            font-size: 28px; font-weight: bold; color: #333;
            font-family: Arial, sans-serif; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            min-height: 34px; text-align: center;
        }
        .square {
            width: 80px; height: 80px;
            background-color: white; border: 1px solid black;
            box-sizing: border-box; cursor: grab; user-select: none;
            border-radius: 4px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: black; font-size: 36px; font-weight: bold;
            font-family: Arial, sans-serif;
        }
        .square.floating { position: absolute; z-index: 500; }
        .square.dragging {
            cursor: grabbing; z-index: 1000;
            outline: 2px solid #4a90e2; outline-offset: 2px;
        }
        .square.docked { position: static; outline: none; }
        .drop-indicator {
            width: 4px; height: 80px; background-color: #4a90e2;
            border-radius: 2px; flex-shrink: 0;
        }
        .version {
            position: fixed;
            right: 10px;
            bottom: 10px;
            font-size: 12px;
            color: #888;
            font-family: Arial, sans-serif;
            user-select: none;
            pointer-events: none;
            z-index: 2000;
        }
        @media (max-width: 700px) {
            .tray { top: 6px; gap: 4px; }
            .square { width: 56px; height: 56px; font-size: 26px; }
            .drop-zone {
                min-width: 0; width: 100%; height: auto; min-height: 130px;
                flex-wrap: wrap; gap: 8px; padding: 12px; align-content: center;
            }
            .stage { width: calc(100vw - 20px); max-width: calc(100vw - 20px); }
            .calc-row { justify-content: center; }
            .calc-button { font-size: 15px; padding: 9px 16px; }
            .calc-result { font-size: 20px; min-height: 26px; white-space: normal; }
            .drop-indicator { height: 56px; width: 3px; }
            .version { font-size: 11px; right: 6px; bottom: 6px; }
        }
        @media (max-width: 380px) {
            .square { width: 48px; height: 48px; font-size: 22px; }
            .drop-indicator { height: 48px; }
            .drop-zone { gap: 6px; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="tray" id="tray"></div>
        <div class="stage">
            <div class="calc-row">
                <button class="calc-button" id="calcButton">Посчитать</button>
            </div>
            <div class="drop-zone" id="dropZone">
                <span class="placeholder" id="placeholder">Перетащите квадраты сюда</span>
            </div>
            <div class="calc-result" id="calcResult"></div>
        </div>
        <div class="version" id="version">версия 1.0</div>
    </div>

    <script>
        const container = document.getElementById('container');
        const tray = document.getElementById('tray');
        const dropZone = document.getElementById('dropZone');
        const placeholder = document.getElementById('placeholder');
        const calcButton = document.getElementById('calcButton');
        const calcResult = document.getElementById('calcResult');
        const versionEl = document.getElementById('version');

        // Версия приложения. При каждом обновлении файла увеличиваем на 0.1.
        const VERSION = '1.0';
        versionEl.textContent = 'версия ' + VERSION;

        let dropIndicator = null;

        const labels = ['1', '2', '3', '4', '5', '+', '−', '·', 'x', '<', '='];

        labels.forEach((label) => {
            const square = document.createElement('div');
            square.className = 'square';
            square.dataset.label = label;
            square.textContent = label;
            makeDraggable(square);
            tray.appendChild(square);
        });

        calcButton.addEventListener('click', () => {
            const docked = [...dropZone.querySelectorAll('.square.docked')];
            if (docked.length === 0) {
                calcResult.textContent = 'Зона пуста';
                calcResult.style.color = '#999';
                return;
            }

            const tokens = docked.map(el => el.dataset.label);

            try {
                const { display, value } = evaluate(tokens);
                calcResult.textContent = value === undefined ? display : `${display} = ${value}`;
                calcResult.style.color = '#333';
            } catch (err) {
                console.error('EVAL ERROR:', err);
                calcResult.textContent = 'Ошибка в выражении';
                calcResult.style.color = '#c0392b';
            }
        });

        function normalizeToken(t) {
            if (t === '−' || t === '–' || t === '—' || t === '-') return '-';
            if (t === '·' || t === '•' || t === '⋅' || t === '*' || t === '×') return '*';
            if (t === 'x' || t === 'х' || t === '𝑥' || t === 'X') return 'x';
            if (t === '<' || t === '＜' || t === '‹') return '<';
            if (t === '=' || t === '＝') return '=';
            return t;
        }

        function evaluate(tokens) {
            const norm = tokens.map(normalizeToken);

            // 1. Склейка цифр + неявное умножение числа и x
            const merged = [];
            for (const t of norm) {
                const isDigit = /^\d+$/.test(t);
                const isX = (t === 'x');
                const prev = merged[merged.length - 1];
                const prevIsDigit = prev !== undefined && /^\d+$/.test(prev);
                const prevIsX = (prev === 'x');

                if (isDigit && prevIsDigit) {
                    merged[merged.length - 1] = prev + t;
                } else if (isDigit && prevIsX) {
                    merged[merged.length - 1] = t + '*x';
                } else if (isX && prevIsDigit) {
                    merged[merged.length - 1] = prev + '*x';
                } else if (isX && prevIsX) {
                    merged.push('*');
                    merged.push(t);
                } else {
                    merged.push(t);
                }
            }

            if (merged.length === 0) throw new Error('empty');

            // 2. Разворачиваем "5*x" обратно в токены, НЕ трогая одиночный '*'
            const flat = [];
            for (const t of merged) {
                if (typeof t === 'string' && t.length > 1 && t.includes('*')) {
                    const parts = t.split('*').filter(p => p !== '');
                    for (let k = 0; k < parts.length; k++) {
                        if (k > 0) flat.push('*');
                        flat.push(parts[k]);
                    }
                } else if (t !== '') {
                    flat.push(t);
                }
            }

            const pretty = flat.join(' ').replace(/\s*\*\s*/g, ' · ');
            const hasX = flat.includes('x');

            // 3. Равенство
            const eqIndex = flat.indexOf('=');
            if (eqIndex !== -1) {
                if (flat.indexOf('=', eqIndex + 1) !== -1) throw new Error('multiple =');
                const left = flat.slice(0, eqIndex);
                const right = flat.slice(eqIndex + 1);
                if (left.length === 0 || right.length === 0) throw new Error('bad =');

                if (!hasX) {
                    const leftVal = evalArithmetic(left);
                    const rightVal = evalArithmetic(right);
                    return { display: pretty, value: (leftVal === rightVal) ? 'верно' : 'неверно' };
                }

                const { a, b } = toLinear(left, right);
                return { display: pretty, value: solveEquation(a, b) };
            }

            // 4. Неравенство
            const cmpIndex = flat.indexOf('<');
            if (cmpIndex !== -1) {
                if (flat.indexOf('<', cmpIndex + 1) !== -1) throw new Error('multiple <');
                const left = flat.slice(0, cmpIndex);
                const right = flat.slice(cmpIndex + 1);
                if (left.length === 0 || right.length === 0) throw new Error('bad <');

                if (!hasX) {
                    const leftVal = evalArithmetic(left);
                    const rightVal = evalArithmetic(right);
                    return { display: pretty, value: (leftVal < rightVal) ? 'верно' : 'неверно' };
                }

                const { a, b } = toLinear(left, right);
                return { display: pretty, value: solveInequality(a, b) };
            }

            // 5. Без '=' и '<'
            if (hasX) {
                const { a, b } = toLinear(flat, []);
                return { display: pretty, value: solveEquation(a, b) };
            }

            const value = evalArithmetic(flat);
            return { display: pretty, value };
        }

        function toLinear(leftTokens, rightTokens) {
            const l = linearCoefs(leftTokens);
            const r = linearCoefs(rightTokens);
            return { a: l.a - r.a, b: l.b - r.b };
        }

        function linearCoefs(tokens) {
            let i = 0;
            let sign = 1;
            const terms = [];

            while (i < tokens.length && tokens[i] === '-') { sign *= -1; i++; }
            if (i >= tokens.length) return { a: 0, b: 0 };
            terms.push(parseLinearTerm(tokens, i, sign));
            i = terms[terms.length - 1].next;

            while (i < tokens.length) {
                const op = tokens[i];
                if (op !== '+' && op !== '-') throw new Error('bad op');
                i++;
                let s = 1;
                while (i < tokens.length && tokens[i] === '-') { s *= -1; i++; }
                const opSign = (op === '-') ? -1 : 1;
                const term = parseLinearTerm(tokens, i, s * opSign);
                terms.push(term);
                i = term.next;
            }

            let a = 0, b = 0;
            for (const t of terms) { a += t.a; b += t.b; }
            return { a, b };
        }

        function parseLinearTerm(tokens, start, sign) {
            let i = start;
            let coef = 1;
            let xCount = 0;
            let hasNumber = false;

            while (i < tokens.length) {
                const t = tokens[i];
                if (/^\d+$/.test(t)) {
                    coef *= parseInt(t, 10);
                    hasNumber = true;
                    i++;
                } else if (t === 'x') {
                    xCount++;
                    i++;
                } else {
                    break;
                }
                if (i < tokens.length && tokens[i] === '*') { i++; continue; }
                else break;
            }

            if (!hasNumber && xCount === 0) throw new Error('bad term');
            if (xCount > 1) throw new Error('x^2 не поддерживается');

            if (xCount === 1) return { a: coef * sign, b: 0, next: i };
            return { a: 0, b: coef * sign, next: i };
        }

        function solveEquation(a, b) {
            if (a === 0) {
                if (b === 0) return 'x — любое';
                return 'нет решений';
            }
            return `x = ${formatNumber(-b / a)}`;
        }

        function solveInequality(a, b) {
            if (a === 0) return b < 0 ? 'верно при любом x' : 'нет решений';
            const bound = -b / a;
            const op = a > 0 ? '<' : '>';
            return `x ${op} ${formatNumber(bound)}`;
        }

        function formatNumber(n) {
            if (Number.isInteger(n)) return String(n);
            return String(parseFloat(n.toFixed(4)));
        }

        function evalArithmetic(tokens) {
            if (tokens.length === 0) throw new Error('empty');

            const terms = [];
            let i = 0;
            let sign = 1;

            while (i < tokens.length && tokens[i] === '-') { sign *= -1; i++; }
            if (i >= tokens.length || !/^\d+$/.test(tokens[i])) throw new Error('no number');
            let current = sign * parseInt(tokens[i], 10);
            i++;

            while (i < tokens.length) {
                const op = tokens[i];
                if (op !== '+' && op !== '-' && op !== '*') throw new Error('bad op');
                i++;

                let s = 1;
                while (i < tokens.length && tokens[i] === '-') { s *= -1; i++; }
                if (i >= tokens.length || !/^\d+$/.test(tokens[i])) throw new Error('no number');
                const num = s * parseInt(tokens[i], 10);
                i++;

                if (op === '*') current = current * num;
                else { terms.push(current); terms.push(op); current = num; }
            }
            terms.push(current);

            let result = terms[0];
            for (let j = 1; j < terms.length; j += 2) {
                const op = terms[j];
                const num = terms[j + 1];
                result = (op === '+') ? result + num : result - num;
            }
            return result;
        }

        function isOverDropZone(el) {
            const rect = el.getBoundingClientRect();
            const zoneRect = dropZone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            return cx >= zoneRect.left && cx <= zoneRect.right &&
                   cy >= zoneRect.top && cy <= zoneRect.bottom;
        }

        function updateDockState() {
            const docked = dropZone.querySelectorAll('.square.docked');
            placeholder.style.display = docked.length > 0 ? 'none' : 'inline';
        }

        function getInsertBefore(cursorX) {
            const docked = [...dropZone.querySelectorAll('.square.docked')];
            for (const el of docked) {
                const rect = el.getBoundingClientRect();
                const midX = rect.left + rect.width / 2;
                if (cursorX < midX) return el;
            }
            return null;
        }

        function showIndicator(beforeEl) {
            if (!dropIndicator) {
                dropIndicator = document.createElement('div');
                dropIndicator.className = 'drop-indicator';
            }
            if (beforeEl) dropZone.insertBefore(dropIndicator, beforeEl);
            else dropZone.appendChild(dropIndicator);
        }

        function hideIndicator() {
            if (dropIndicator && dropIndicator.parentNode) {
                dropIndicator.parentNode.removeChild(dropIndicator);
            }
        }

        function makeFloating(el) {
            const rect = el.getBoundingClientRect();
            el.classList.add('floating');
            el.style.left = rect.left + 'px';
            el.style.top = rect.top + 'px';
            el.style.width = rect.width + 'px';
            el.style.height = rect.height + 'px';
            container.appendChild(el);
            return rect;
        }

        function dockSquare(el, cursorX) {
            const rect = el.getBoundingClientRect();
            const insertBefore = getInsertBefore(cursorX);

            el.classList.add('docked');
            el.classList.remove('dragging');
            el.classList.remove('floating');
            el.style.left = '';
            el.style.top = '';
            el.style.width = '';
            el.style.height = '';
            el.style.position = '';
            el.style.cursor = 'grab';

            hideIndicator();

            if (insertBefore) dropZone.insertBefore(el, insertBefore);
            else dropZone.appendChild(el);

            updateDockState();

            const newRect = el.getBoundingClientRect();
            const dx = rect.left - newRect.left;
            const dy = rect.top - newRect.top;

            if (dx || dy) {
                el.style.transition = 'none';
                el.style.transform = `translate(${dx}px, ${dy}px)`;
                requestAnimationFrame(() => {
                    el.style.transition = 'transform 0.2s ease';
                    el.style.transform = '';
                    el.addEventListener('transitionend', () => {
                        el.style.transition = '';
                    }, { once: true });
                });
            }
        }

        function makeDraggable(element) {
            let offsetX = 0, offsetY = 0, isDragging = false;

            element.addEventListener('mousedown', (e) => {
                let rect;
                if (element.classList.contains('docked')) {
                    const r = element.getBoundingClientRect();
                    element.classList.remove('docked');
                    container.appendChild(element);
                    element.classList.add('floating');
                    element.style.left = r.left + 'px';
                    element.style.top = r.top + 'px';
                    rect = r;
                    updateDockState();
                } else {
                    rect = element.getBoundingClientRect();
                    if (!element.classList.contains('floating')) {
                        makeFloating(element);
                    }
                }

                isDragging = true;
                element.classList.add('dragging');
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                let newLeft = e.clientX - offsetX;
                let newTop = e.clientY - offsetY;
                const maxLeft = window.innerWidth - element.offsetWidth;
                const maxTop = window.innerHeight - element.offsetHeight;
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));

                element.style.left = newLeft + 'px';
                element.style.top = newTop + 'px';

                if (isOverDropZone(element)) {
                    dropZone.classList.add('active');
                    showIndicator(getInsertBefore(e.clientX));
                } else {
                    dropZone.classList.remove('active');
                    hideIndicator();
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                element.classList.remove('dragging');
                dropZone.classList.remove('active');
                hideIndicator();

                if (isOverDropZone(element)) {
                    dockSquare(element, e.clientX);
                }
            });

            element.addEventListener('touchstart', (e) => {
                let rect;
                if (element.classList.contains('docked')) {
                    const r = element.getBoundingClientRect();
                    element.classList.remove('docked');
                    container.appendChild(element);
                    element.classList.add('floating');
                    element.style.left = r.left + 'px';
                    element.style.top = r.top + 'px';
                    rect = r;
                    updateDockState();
                } else {
                    rect = element.getBoundingClientRect();
                    if (!element.classList.contains('floating')) {
                        makeFloating(element);
                    }
                }

                isDragging = true;
                element.classList.add('dragging');
                const touch = e.touches[0];
                offsetX = touch.clientX - rect.left;
                offsetY = touch.clientY - rect.top;
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                let newLeft = touch.clientX - offsetX;
                let newTop = touch.clientY - offsetY;
                const maxLeft = window.innerWidth - element.offsetWidth;
                const maxTop = window.innerHeight - element.offsetHeight;
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                element.style.left = newLeft + 'px';
                element.style.top = newTop + 'px';
                if (isOverDropZone(element)) {
                    dropZone.classList.add('active');
                    showIndicator(getInsertBefore(touch.clientX));
                } else {
                    dropZone.classList.remove('active');
                    hideIndicator();
                }
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                if (!isDragging) return;
                isDragging = false;
                element.classList.remove('dragging');
                dropZone.classList.remove('active');
                hideIndicator();
                if (isOverDropZone(element)) {
                    const touch = e.changedTouches[0];
                    dockSquare(element, touch.clientX);
                }
            });
        }
    </script>
</body>
</html>
