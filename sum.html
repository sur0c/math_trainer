<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Перетаскиваемые квадраты с ручной сортировкой</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; background-color: #f0f0f0;
            font-family: Arial, sans-serif; overflow: hidden;
            height: 100%; touch-action: none;
        }
        .container { position: relative; width: 100%; height: 100%; }
        .tray {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 6px; max-width: calc(100vw - 20px);
            z-index: 100; pointer-events: none;
        }
        .tray > * { pointer-events: auto; }
        .stage {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: stretch;
            gap: 12px; width: max-content; max-width: calc(100vw - 20px);
            box-sizing: border-box;
            pointer-events: none;
        }
        .stage > * { pointer-events: auto; }
        .controls {
            display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap;
        }
        .calc-button {
            background-color: #b0b0b0; color: white; border: none;
            border-radius: 8px; padding: 10px 20px; font-size: 16px;
            font-weight: bold; font-family: Arial, sans-serif; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s; white-space: nowrap;
        }
        .calc-button:hover { background-color: #999; }
        .calc-button:active { background-color: #808080; }
        .calc-button.secondary { background-color: #d0d0d0; color: #333; }
        .calc-button.secondary:hover { background-color: #c0c0c0; }
        .calc-button.secondary:active { background-color: #b0b0b0; }
        .drop-zone {
            min-width: 600px; width: max-content; max-width: 100%;
            height: 200px; max-height: 40vh; overflow-y: auto;
            border: 2px dashed #999; border-radius: 12px;
            background-color: rgba(255,255,255,0.4);
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 20px; box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .drop-zone.active {
            border-color: #4a90e2;
            background-color: rgba(74,144,226,0.1);
        }
        .drop-zone .placeholder { color: #999; font-size: 14px; user-select: none; }
        .calc-result {
            font-size: 28px; font-weight: bold; color: #333;
            font-family: Arial, sans-serif;
            min-height: 34px; text-align: center;
            word-break: break-word;
        }
        .calc-result.error { color: #c0392b; }
        .calc-result.muted { color: #999; }
        .square {
            width: 80px; height: 80px;
            background-color: white; border: 1px solid black;
            box-sizing: border-box; cursor: grab; user-select: none;
            border-radius: 4px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: black; font-size: 36px; font-weight: bold;
            font-family: Arial, sans-serif;
        }
        .square.var { font-style: italic; }
        .square:focus-visible { outline: 3px solid #4a90e2; outline-offset: 2px; }
        .square.floating { position: absolute; z-index: 500; }
        .square.dragging {
            cursor: grabbing; z-index: 1000;
            outline: 2px solid #4a90e2; outline-offset: 2px;
        }
        .square.docked { position: static; outline: none; }
        .square.kbd-active { outline: 3px solid #4a90e2; outline-offset: 2px; z-index: 600; }
        .drop-indicator {
            width: 4px; height: 80px; background-color: #4a90e2;
            border-radius: 2px; flex-shrink: 0;
        }
        .version {
            position: fixed; right: 10px; bottom: 10px;
            font-size: 12px; color: #888;
            font-family: Arial, sans-serif;
            user-select: none; pointer-events: none; z-index: 2000;
        }
        .home-button {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 2000;
            display: inline-block;
            padding: 8px 14px;
            background-color: #b0b0b0;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .home-button:hover { background-color: #999; }
        .home-button:active { background-color: #808080; }
        @media (max-width: 700px) {
            .tray { top: 6px; gap: 4px; }
            .square { width: 56px; height: 56px; font-size: 26px; }
            .drop-zone {
                min-width: 0; width: 100%; height: auto; min-height: 130px;
                max-height: 45vh;
                flex-wrap: wrap; gap: 8px; padding: 12px; align-content: center;
            }
            .stage { width: calc(100vw - 20px); max-width: calc(100vw - 20px); }
            .controls { justify-content: center; }
            .calc-button { font-size: 15px; padding: 9px 16px; }
            .calc-result { font-size: 20px; min-height: 26px; }
            .drop-indicator { height: 56px; width: 3px; }
            .version { font-size: 11px; right: 6px; bottom: 6px; }
        }
        @media (max-width: 380px) {
            .square { width: 48px; height: 48px; font-size: 22px; }
            .drop-indicator { height: 48px; }
            .drop-zone { gap: 6px; padding: 10px; max-height: 50vh; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-button" id="homeButton" aria-label="На главную">← На главную</a>

    <div class="container" id="container">
        <div class="tray" id="tray" role="toolbar" aria-label="Доступные квадраты"></div>
        <div class="stage" id="stage">
            <div class="controls">
                <button class="calc-button" id="calcButton">Посчитать</button>
                <button class="calc-button secondary" id="clearButton">Очистить</button>
                <button class="calc-button secondary" id="resetButton">Вернуть всё в трей</button>
            </div>
            <div class="drop-zone" id="dropZone" role="region" aria-label="Зона выражения">
                <span class="placeholder" id="placeholder">Перетащите квадраты сюда</span>
            </div>
            <div class="calc-result" id="calcResult" role="status" aria-live="polite"></div>
        </div>
        <div class="version" id="version"></div>
    </div>

    <script>
        const VERSION = '1.7';
        document.getElementById('version').textContent = 'версия ' + VERSION;

        const container = document.getElementById('container');
        const tray = document.getElementById('tray');
        const stage = document.getElementById('stage');
        const homeButton = document.getElementById('homeButton');
        const dropZone = document.getElementById('dropZone');
        const placeholder = document.getElementById('placeholder');
        const calcButton = document.getElementById('calcButton');
        const clearButton = document.getElementById('clearButton');
        const resetButton = document.getElementById('resetButton');
        const calcResult = document.getElementById('calcResult');

        let dropIndicator = null;
        let activeDrag = null;
        let rafPending = false;
        let lastPointer = { x: 0, y: 0 };
        let kbdEl = null;
        let layoutScheduled = false;

        const labels = ['1', '2', '3', '4', '5', '+', '−', '·', '/', 'x', '<', '='];

        labels.forEach((label) => {
            const square = document.createElement('div');
            square.className = 'square' + (label === 'x' ? ' var' : '');
            square.dataset.label = label;
            square.textContent = label;
            square.setAttribute('role', 'button');
            square.setAttribute('tabindex', '0');
            square.setAttribute('aria-label', ariaLabelFor(label));
            tray.appendChild(square);
        });

        function ariaLabelFor(label) {
            switch (label) {
                case '+': return 'плюс';
                case '−': return 'минус';
                case '·': return 'умножить';
                case '/': return 'разделить';
                case 'x': return 'икс';
                case '<': return 'меньше';
                case '=': return 'равно';
                default: return 'число ' + label;
            }
        }

        function rectsOverlap(a, b) {
            return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
        }

        // ===== Позиционирование =====
        // Один reflow-цикл:
        //   1. Сброс трея к CSS-положению, одно чтение trayRect + trayHeight.
        //   2. Если трей пересекается с кнопкой «На главную» — опускаем трей
        //      и считаем новый bottom арифметически (высота трея не меняется от top).
        //   3. Stage к центрированию, одно чтение stageRect + stageHeight.
        //   4. Если stage пересекается с треем по вертикали — ставим stage под трей.
        function updateLayoutNow() {
            // --- Шаг 1: трей в исходное положение ---
            tray.style.top = '';
            // Один reflow: читаем и высоту, и rect
            const trayHeight = tray.offsetHeight;
            const trayRect = tray.getBoundingClientRect();

            // --- Шаг 2: трей vs кнопка «На главную» ---
            const homeRect = homeButton.getBoundingClientRect();
            let trayBottom = trayRect.bottom;
            if (rectsOverlap(trayRect, homeRect)) {
                const gap = 8;
                const newTop = homeRect.bottom + gap;
                tray.style.top = newTop + 'px';
                trayBottom = newTop + trayHeight; // без повторного чтения
            }

            // --- Шаг 3: stage к центрированию ---
            stage.style.top = '50%';
            stage.style.transform = 'translate(-50%, -50%)';
            // Один reflow: читаем высоту и rect
            const stageRect = stage.getBoundingClientRect();

            // --- Шаг 4: stage vs трей (только по вертикали) ---
            const overlapY = !(stageRect.bottom < trayRect.top || stageRect.top > trayBottom);
            if (overlapY) {
                const gap = 12;
                // Всегда ставим под трей. Если не влезает по высоте — обрежется снизу,
                // но не перекроет трей. Высоту stage ограничивает max-height у .drop-zone.
                stage.style.top = (trayBottom + gap) + 'px';
                stage.style.transform = 'translateX(-50%)';
            }
        }

        // Планируем пересчёт на следующий кадр — схлопывает серию вызовов
        function updateLayout() {
            if (layoutScheduled) return;
            layoutScheduled = true;
            requestAnimationFrame(() => {
                layoutScheduled = false;
                updateLayoutNow();
            });
        }

        // Первичный вызов — синхронно, чтобы не мигало при загрузке
        updateLayoutNow();

        window.addEventListener('resize', updateLayout);
        window.addEventListener('load', updateLayout);

        // ===== Кнопки =====
        calcButton.addEventListener('click', () => {
            const docked = [...dropZone.querySelectorAll('.square.docked')];
            if (docked.length === 0) {
                setResult('Зона пуста', 'muted');
                return;
            }
            const tokens = docked.map(el => el.dataset.label);
            try {
                const { display, value } = evaluate(tokens);
                calcResult.classList.remove('error', 'muted');
                calcResult.textContent = value === undefined ? display : `${display} = ${value}`;
            } catch (err) {
                setResult(err.message || 'Ошибка в выражении', 'error');
                console.error('EVAL ERROR:', err);
            }
        });

        clearButton.addEventListener('click', () => {
            const docked = [...dropZone.querySelectorAll('.square.docked')];
            for (const el of docked) {
                const r = el.getBoundingClientRect();
                el.classList.remove('docked');
                el.classList.add('floating');
                el.style.left = r.left + 'px';
                el.style.top = r.top + 'px';
                el.style.width = r.width + 'px';
                el.style.height = r.height + 'px';
                container.appendChild(el);
            }
            updateDockState();
            setResult('', '');
            updateLayout();
        });

        resetButton.addEventListener('click', () => {
            document.querySelectorAll('.square').forEach(el => {
                el.classList.remove('docked', 'floating', 'dragging', 'kbd-active');
                el.style.left = '';
                el.style.top = '';
                el.style.width = '';
                el.style.height = '';
                el.style.position = '';
                el.style.transform = '';
                el.style.transition = '';
                tray.appendChild(el);
            });
            kbdEl = null;
            updateDockState();
            setResult('', '');
            updateLayout();
        });

        function setResult(text, cls) {
            calcResult.textContent = text;
            calcResult.classList.remove('error', 'muted');
            if (cls) calcResult.classList.add(cls);
        }

        // ===== Нормализация =====
        function normalizeToken(t) {
            if (t === '−' || t === '–' || t === '—' || t === '-') return '-';
            if (t === '·' || t === '•' || t === '⋅' || t === '*' || t === '×') return '*';
            if (t === '/') return '/';
            if (t === 'x' || t === 'х' || t === '𝑥' || t === 'X') return 'x';
            if (t === '<' || t === '＜' || t === '‹') return '<';
            if (t === '=' || t === '＝') return '=';
            return t;
        }

        // ===== Токенизация =====
        function tokenize(tokens) {
            const norm = tokens.map(normalizeToken);
            const merged = [];
            for (const t of norm) {
                const isDigit = /^\d+$/.test(t);
                const isX = (t === 'x');
                const prev = merged[merged.length - 1];
                const prevIsDigit = prev !== undefined && /^\d+$/.test(prev);
                const prevIsX = (prev === 'x');

                if (isDigit && prevIsDigit) {
                    merged[merged.length - 1] = prev + t;
                } else if (isDigit && prevIsX) {
                    merged[merged.length - 1] = t + '*x';
                } else if (isX && prevIsDigit) {
                    merged[merged.length - 1] = prev + '*x';
                } else if (isX && prevIsX) {
                    merged.push('*');
                    merged.push(t);
                } else {
                    merged.push(t);
                }
            }

            const flat = [];
            for (const t of merged) {
                if (typeof t === 'string' && t.length > 1 && t.includes('*')) {
                    const parts = t.split('*').filter(p => p !== '');
                    for (let k = 0; k < parts.length; k++) {
                        if (k > 0) flat.push('*');
                        flat.push(parts[k]);
                    }
                } else if (t !== '') {
                    flat.push(t);
                }
            }
            return flat;
        }

        // ===== Парсер =====
        function parseArithmetic(tokens) {
            let pos = 0;
            function peek() { return tokens[pos]; }
            function next() { return tokens[pos++]; }

            function parseExpr() {
                let val = parseTerm();
                while (peek() === '+' || peek() === '-') {
                    const op = next();
                    const rhs = parseTerm();
                    val = op === '+' ? val + rhs : val - rhs;
                }
                return val;
            }
            function parseTerm() {
                let val = parseFactor();
                while (peek() === '*' || peek() === '/') {
                    const op = next();
                    const rhs = parseFactor();
                    if (op === '/') {
                        if (rhs === 0) throw new Error('деление на ноль');
                        val = val / rhs;
                    } else {
                        val = val * rhs;
                    }
                }
                return val;
            }
            function parseFactor() {
                const t = peek();
                if (t === '-') { next(); return -parseFactor(); }
                if (t === '+') { next(); return parseFactor(); }
                if (t === undefined) throw new Error('неполное выражение');
                if (t === 'x') throw new Error('выражение содержит x — нужен знак = или <');
                if (/^\d+$/.test(t)) { next(); return parseInt(t, 10); }
                throw new Error('неполное выражение');
            }

            if (tokens.length === 0) throw new Error('неполное выражение');
            const result = parseExpr();
            if (pos < tokens.length) throw new Error('неполное выражение');
            return result;
        }

        function linearCoefs(tokens) {
            let pos = 0;
            function peek() { return tokens[pos]; }
            function next() { return tokens[pos++]; }

            function parseExpr() {
                let coef = parseTerm();
                while (peek() === '+' || peek() === '-') {
                    const op = next();
                    const rhs = parseTerm();
                    coef = op === '+'
                        ? { a: coef.a + rhs.a, b: coef.b + rhs.b }
                        : { a: coef.a - rhs.a, b: coef.b - rhs.b };
                }
                return coef;
            }
            function parseTerm() {
                let coef = parseFactor();
                while (peek() === '*' || peek() === '/') {
                    const op = next();
                    const rhs = parseFactor();
                    if (op === '/') {
                        if (rhs.a !== 0) throw new Error('деление на x не поддерживается');
                        if (rhs.b === 0) throw new Error('деление на ноль');
                        coef = { a: coef.a / rhs.b, b: coef.b / rhs.b };
                    } else {
                        if (coef.a !== 0 && rhs.a !== 0) throw new Error('x² не поддерживается');
                        if (coef.a !== 0) {
                            coef = { a: coef.a * rhs.b, b: coef.b * rhs.b };
                        } else if (rhs.a !== 0) {
                            coef = { a: rhs.a * coef.b, b: rhs.b * coef.b };
                        } else {
                            coef = { a: 0, b: coef.b * rhs.b };
                        }
                    }
                }
                return coef;
            }
            function parseFactor() {
                const t = peek();
                if (t === '-') { next(); const f = parseFactor(); return { a: -f.a, b: -f.b }; }
                if (t === '+') { next(); return parseFactor(); }
                if (t === undefined) throw new Error('неполное выражение');
                if (t === 'x') { next(); return { a: 1, b: 0 }; }
                if (/^\d+$/.test(t)) { next(); return { a: 0, b: parseInt(t, 10) }; }
                throw new Error('неполное выражение');
            }

            if (tokens.length === 0) throw new Error('неполное выражение');
            const result = parseExpr();
            if (pos < tokens.length) throw new Error('неполное выражение');
            return result;
        }

        // ===== Вычислитель =====
        function evaluate(tokens) {
            const flat = tokenize(tokens);
            const pretty = flat.join(' ').replace(/\s*\*\s*/g, ' · ').replace(/\s*\/\s*/g, ' ÷ ');
            const hasX = flat.includes('x');

            const eqIndex = flat.indexOf('=');
            if (eqIndex !== -1) {
                if (flat.indexOf('=', eqIndex + 1) !== -1) throw new Error('два знака =');
                const left = flat.slice(0, eqIndex);
                const right = flat.slice(eqIndex + 1);
                if (left.length === 0 || right.length === 0) throw new Error('неполное выражение');

                if (!hasX) {
                    const lv = parseArithmetic(left);
                    const rv = parseArithmetic(right);
                    return { display: pretty, value: Math.abs(lv - rv) < 1e-9 ? 'верно' : 'неверно' };
                }
                const L = linearCoefs(left);
                const R = linearCoefs(right);
                return { display: pretty, value: solveEquation(L.a - R.a, L.b - R.b) };
            }

            const cmpIndex = flat.indexOf('<');
            if (cmpIndex !== -1) {
                if (flat.indexOf('<', cmpIndex + 1) !== -1) throw new Error('два знака <');
                const left = flat.slice(0, cmpIndex);
                const right = flat.slice(cmpIndex + 1);
                if (left.length === 0 || right.length === 0) throw new Error('неполное выражение');

                if (!hasX) {
                    const lv = parseArithmetic(left);
                    const rv = parseArithmetic(right);
                    return { display: pretty, value: lv < rv ? 'верно' : 'неверно' };
                }
                const L = linearCoefs(left);
                const R = linearCoefs(right);
                return { display: pretty, value: solveInequality(L.a - R.a, L.b - R.b) };
            }

            if (hasX) {
                const L = linearCoefs(flat);
                return { display: pretty, value: solveEquation(L.a, L.b) };
            }
            const value = parseArithmetic(flat);
            return { display: pretty, value: formatNumber(value) };
        }

        function solveEquation(a, b) {
            if (a === 0) {
                if (b === 0) return 'x — любое';
                return 'нет решений';
            }
            return `x = ${formatNumber(-b / a)}`;
        }

        function solveInequality(a, b) {
            if (a === 0) return b < 0 ? 'верно при любом x' : 'нет решений';
            const bound = -b / a;
            const op = a > 0 ? '<' : '>';
            return `x ${op} ${formatNumber(bound)}`;
        }

        function formatNumber(n) {
            if (!isFinite(n)) return String(n);
            if (Number.isInteger(n)) return String(n);
            return String(parseFloat(n.toFixed(4)));
        }

        // ===== Геометрия =====
        function pointInDropZone(x, y) {
            const zr = dropZone.getBoundingClientRect();
            return x >= zr.left && x <= zr.right && y >= zr.top && y <= zr.bottom;
        }

        function updateDockState() {
            const docked = dropZone.querySelectorAll('.square.docked');
            placeholder.style.display = docked.length > 0 ? 'none' : 'inline';
        }

        function getInsertBefore(cursorX) {
            const docked = [...dropZone.querySelectorAll('.square.docked')];
            for (const el of docked) {
                const rect = el.getBoundingClientRect();
                if (cursorX < rect.left + rect.width / 2) return el;
            }
            return null;
        }

        function showIndicator(beforeEl) {
            if (!dropIndicator) {
                dropIndicator = document.createElement('div');
                dropIndicator.className = 'drop-indicator';
            }
            if (beforeEl) dropZone.insertBefore(dropIndicator, beforeEl);
            else dropZone.appendChild(dropIndicator);
        }

        function hideIndicator() {
            if (dropIndicator && dropIndicator.parentNode) {
                dropIndicator.parentNode.removeChild(dropIndicator);
            }
        }

        // ===== Перетаскивание =====
        function startDrag(el, clientX, clientY) {
            let rect;
            if (el.classList.contains('docked')) {
                rect = el.getBoundingClientRect();
                el.classList.remove('docked');
                container.appendChild(el);
                el.classList.add('floating');
                el.style.left = rect.left + 'px';
                el.style.top = rect.top + 'px';
                el.style.width = rect.width + 'px';
                el.style.height = rect.height + 'px';
                updateDockState();
                updateLayout();
            } else if (el.parentElement !== container) {
                rect = el.getBoundingClientRect();
                el.classList.add('floating');
                el.style.left = rect.left + 'px';
                el.style.top = rect.top + 'px';
                el.style.width = rect.width + 'px';
                el.style.height = rect.height + 'px';
                container.appendChild(el);
                updateLayout();
            } else {
                rect = el.getBoundingClientRect();
            }

            el.classList.add('dragging');
            kbdEl = null;
            activeDrag = {
                el,
                offsetX: clientX - rect.left,
                offsetY: clientY - rect.top,
                moved: false
            };
        }

        function moveDrag(clientX, clientY) {
            if (!activeDrag) return;
            const el = activeDrag.el;
            activeDrag.moved = true;

            let left = clientX - activeDrag.offsetX;
            let top = clientY - activeDrag.offsetY;
            const maxLeft = window.innerWidth - el.offsetWidth;
            const maxTop = window.innerHeight - el.offsetHeight;
            left = Math.max(0, Math.min(left, maxLeft));
            top = Math.max(0, Math.min(top, maxTop));

            el.style.left = left + 'px';
            el.style.top = top + 'px';

            lastPointer = { x: clientX, y: clientY };
            if (!rafPending) {
                rafPending = true;
                requestAnimationFrame(() => {
                    rafPending = false;
                    updateDropHints(lastPointer.x, lastPointer.y);
                });
            }
        }

        function updateDropHints(x, y) {
            if (!activeDrag) return;
            if (pointInDropZone(x, y)) {
                dropZone.classList.add('active');
                showIndicator(getInsertBefore(x));
            } else {
                dropZone.classList.remove('active');
                hideIndicator();
            }
        }

        function endDrag() {
            if (!activeDrag) return;
            const el = activeDrag.el;
            const { x, y } = lastPointer;
            el.classList.remove('dragging');
            dropZone.classList.remove('active');
            hideIndicator();

            if (activeDrag.moved && pointInDropZone(x, y)) {
                dockSquare(el, x);
            }
            activeDrag = null;
            updateLayout();
        }

        function dockSquare(el, cursorX) {
            const rect = el.getBoundingClientRect();
            const insertBefore = getInsertBefore(cursorX);

            el.classList.add('docked');
            el.classList.remove('floating', 'kbd-active');
            el.style.left = '';
            el.style.top = '';
            el.style.width = '';
            el.style.height = '';
            el.style.position = '';
            el.style.cursor = 'grab';

            if (insertBefore) dropZone.insertBefore(el, insertBefore);
            else dropZone.appendChild(el);

            updateDockState();
            updateLayout();

            const newRect = el.getBoundingClientRect();
            const dx = rect.left - newRect.left;
            const dy = rect.top - newRect.top;
            if (dx || dy) {
                el.style.transition = 'none';
                el.style.transform = `translate(${dx}px, ${dy}px)`;
                requestAnimationFrame(() => {
                    el.style.transition = 'transform 0.2s ease';
                    el.style.transform = '';
                    el.addEventListener('transitionend', () => {
                        el.style.transition = '';
                    }, { once: true });
                });
            }
        }

        // ===== Глобальные слушатели =====
        function onPointerDown(e) {
            const el = e.target.closest('.square');
            if (!el) return;

            let cx, cy;
            if (e.type === 'touchstart') {
                const t = e.touches[0] || e.changedTouches[0];
                cx = t.clientX; cy = t.clientY;
            } else {
                cx = e.clientX; cy = e.clientY;
            }
            startDrag(el, cx, cy);
            lastPointer = { x: cx, y: cy };
            e.preventDefault();
        }

        document.addEventListener('mousedown', onPointerDown);
        document.addEventListener('touchstart', onPointerDown, { passive: false });

        document.addEventListener('mousemove', (e) => {
            if (!activeDrag) return;
            moveDrag(e.clientX, e.clientY);
            e.preventDefault();
        });

        document.addEventListener('touchmove', (e) => {
            if (!activeDrag) return;
            const t = e.touches[0] || e.changedTouches[0];
            moveDrag(t.clientX, t.clientY);
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('mouseup', () => { if (activeDrag) endDrag(); });
        document.addEventListener('touchend', () => { if (activeDrag) endDrag(); });
        document.addEventListener('touchcancel', () => { if (activeDrag) { lastPointer = { x: -1, y: -1 }; endDrag(); } });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (activeDrag) {
                    activeDrag.el.classList.remove('dragging');
                    dropZone.classList.remove('active');
                    hideIndicator();
                    activeDrag = null;
                    updateLayout();
                    e.preventDefault();
                    return;
                }
                if (kbdEl) {
                    kbdEl.classList.remove('kbd-active');
                    kbdEl = null;
                    e.preventDefault();
                    return;
                }
            }

            const el = e.target.closest('.square');
            if (!el) return;

            if (el.classList.contains('kbd-active')) {
                const step = e.shiftKey ? 1 : 10;
                const r = el.getBoundingClientRect();
                let moved = false;
                switch (e.key) {
                    case 'ArrowLeft':  el.style.left = (r.left - step) + 'px'; moved = true; break;
                    case 'ArrowRight': el.style.left = (r.left + step) + 'px'; moved = true; break;
                    case 'ArrowUp':    el.style.top  = (r.top - step)  + 'px'; moved = true; break;
                    case 'ArrowDown':  el.style.top  = (r.top + step)  + 'px'; moved = true; break;
                    case 'Enter':
                    case ' ':
                        {
                            const cx = r.left + r.width / 2;
                            const cy = r.top + r.height / 2;
                            if (pointInDropZone(cx, cy)) {
                                dockSquare(el, cx);
                            } else {
                                el.classList.remove('floating', 'kbd-active');
                                el.style.left = '';
                                el.style.top = '';
                                el.style.width = '';
                                el.style.height = '';
                                el.style.position = '';
                                el.style.transform = '';
                                el.style.transition = '';
                                tray.appendChild(el);
                                updateLayout();
                            }
                            kbdEl = null;
                            e.preventDefault();
                            return;
                        }
                }
                if (moved) {
                    const nr = el.getBoundingClientRect();
                    if (nr.left < 0) el.style.left = '0px';
                    if (nr.top < 0) el.style.top = '0px';
                    if (nr.right > window.innerWidth) el.style.left = (window.innerWidth - nr.width) + 'px';
                    if (nr.bottom > window.innerHeight) el.style.top = (window.innerHeight - nr.height) + 'px';
                    e.preventDefault();
                }
                return;
            }

            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                if (el.classList.contains('docked')) {
                    const r = el.getBoundingClientRect();
                    el.classList.remove('docked');
                    el.classList.add('floating');
                    el.style.left = r.left + 'px';
                    el.style.top = r.top + 'px';
                    el.style.width = r.width + 'px';
                    el.style.height = r.height + 'px';
                    container.appendChild(el);
                    updateDockState();
                    updateLayout();
                } else if (!el.classList.contains('floating')) {
                    const r = el.getBoundingClientRect();
                    el.classList.add('floating');
                    el.style.left = r.left + 'px';
                    el.style.top = r.top + 'px';
                    el.style.width = r.width + 'px';
                    el.style.height = r.height + 'px';
                    container.appendChild(el);
                    updateLayout();
                }
                el.classList.add('kbd-active');
                kbdEl = el;
                el.focus();
            }
        });

        document.addEventListener('dblclick', (e) => {
            const el = e.target.closest('.square');
            if (!el) return;
            if (!el.classList.contains('floating')) return;
            el.classList.remove('floating', 'kbd-active');
            el.style.left = '';
            el.style.top = '';
            el.style.width = '';
            el.style.height = '';
            el.style.position = '';
            el.style.transform = '';
            el.style.transition = '';
            if (kbdEl === el) kbdEl = null;
            tray.appendChild(el);
            updateLayout();
        });

        updateDockState();
        updateLayoutNow();
    </script>
</body>
</html>
