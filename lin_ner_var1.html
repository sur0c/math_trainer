<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собери промежуток — решение неравенств</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e6f0f5 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            margin: 0; padding: 20px;
        }
        .game-container {
            max-width: 980px; width: 100%;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px);
            border-radius: 48px; box-shadow: 0 25px 40px -10px rgba(0, 30, 50, 0.3), 0 0 0 1px rgba(255,255,255,0.7) inset;
            padding: 36px 30px 30px;
        }
        h1 {
            font-size: 2rem; font-weight: 600; color: #1a3e60; text-align: center;
            margin: 0 0 20px; display: flex; align-items: center; justify-content: center;
            gap: 12px; flex-wrap: wrap;
        }
        h1 span { background: #1a3e60; color: #fff; font-size: 1.1rem; padding: 6px 16px; border-radius: 60px; font-weight: 500; }
        .inequality-box {
            background: #ffffffd9; border-radius: 32px; padding: 28px 24px; margin-bottom: 28px;
            box-shadow: 0 10px 20px -8px rgba(0, 20, 40, 0.2), 0 0 0 1px #ffffff inset, 0 0 0 1px #bdd3e6;
            text-align: center; font-weight: 700; color: #0b2d46; line-height: 1.6; font-size: 2.3rem;
            white-space: normal; overflow-wrap: break-word;
        }
        .inequality-box .term { white-space: nowrap; }
        .answer-zone-label {
            font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.08em;
            color: #5b7a96; margin-bottom: 10px; text-align: center; font-weight: 600;
        }
        .answer-zone {
            min-height: 110px; border: 2.5px dashed #a9c3d9; border-radius: 28px;
            background: #f4faffb3; display: flex; flex-wrap: wrap; gap: 14px;
            justify-content: center; align-items: center; padding: 18px; margin-bottom: 28px;
            cursor: pointer; touch-action: none;
        }
        .answer-zone.drag-over { background: #e3f1ff; border-color: #1a78c2; }
        .answer-zone .placeholder {
            color: #8aa6bd; font-size: 1.15rem; font-weight: 500;
            user-select: none; pointer-events: none;
        }
        /* Карточка в поле ответа выглядит аккуратно, без фокуса */
        .answer-zone .card {
            outline: none !important;
            box-shadow: 0 0 0 2px #1a78c2 !important;
        }
        .cards-area { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 28px; min-height: 90px; }
        .card {
            background: white; border-radius: 22px; padding: 12px 18px; font-size: 1.5rem;
            font-weight: 600; color: #0b2d46; box-shadow: 0 12px 18px -8px rgba(0, 30, 50, 0.25), 0 0 0 1px #cddfee inset;
            cursor: grab; min-width: 115px; text-align: center; user-select: none;
            border: 2px solid transparent; touch-action: none; white-space: nowrap;
            transition: box-shadow 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
        }
        .card:focus-visible { outline: 3px solid #1a78c2; outline-offset: 2px; }
        .card.placed { background: #d4e9ff; border: 2px solid #1a78c2; }
        .card.correct-highlight { background: #c8e6d0; border: 2px solid #1d7a47; }
        .card.wrong-highlight { background: #fad1d1; border: 2px solid #b33b3b; }
        .card.disabled { pointer-events: none; opacity: 0.75; }
        .card.ghost { position: fixed; pointer-events: none; z-index: 1000; opacity: 0.9; }
        .card.selected { border: 2px solid #1a78c2; background: #e8f3ff; }
        .card.dragging { opacity: 0.35; }
        
        .controls { display: flex; justify-content: center; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
        button {
            border: none; background: #1a3e60; color: white; padding: 15px 30px;
            font-size: 1.2rem; font-weight: 600; border-radius: 60px; cursor: pointer;
        }
        button.secondary { background: #fff; color: #1a3e60; box-shadow: 0 0 0 1px #bdd3e6 inset; }
        button:disabled { opacity: 0.45; pointer-events: none; }
        
        .message-area { 
            text-align: center; margin-top: 22px; min-height: 54px; font-size: 1.25rem; 
            display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
        }
        .feedback-success { color: #1d7a47; background: #e2f3e6; padding: 9px 24px; border-radius: 60px; }
        .feedback-error { color: #b33b3b; background: #fce4e4; padding: 9px 24px; border-radius: 60px; }
        /* Запрещаем перенос внутри правильного интервала */
        .nowrap-interval { white-space: nowrap; }
        
        .footer { margin-top: 18px; display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; align-items: center; }
        .score-badge { background: #fff; padding: 9px 20px; border-radius: 60px; font-weight: 600; box-shadow: 0 0 0 1px #bdd3e6 inset; }
        .reset-btn { background: transparent; color: #1a3e60; box-shadow: 0 0 0 1.5px #bdd3e6 inset; padding: 11px 22px; font-size: 0.95rem; }
        
        @media (max-width: 700px) {
            .inequality-box { font-size: 1.7rem; }
            .card { font-size: 1.1rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>Собери промежуток <span id="scoreDisplay">0</span></h1>
    <div class="inequality-box" id="inequalityDisplay">2x + 3 > 7</div>
    <div class="answer-zone-label">Поле ответа</div>
    <div class="answer-zone" id="answerZone" role="button" tabindex="0" aria-label="Поле ответа. Перетащите или выберите карточку.">
        <span class="placeholder" id="answerPlaceholder">Перетащите карточку сюда</span>
    </div>
    <div class="cards-area" id="cardsContainer" role="group" aria-label="Варианты промежутков"></div>
    <div class="controls">
        <button id="checkBtn">Проверить</button>
        <button id="newTaskBtn" class="secondary">Новое задание</button>
    </div>
    <div class="message-area" id="messageArea" role="status" aria-live="polite"></div>
    <div class="footer">
        <div class="score-badge">Очки: <span id="scoreValue">0</span></div>
        <button id="resetScoreBtn" class="reset-btn">Сбросить счёт</button>
    </div>
</div>

<!-- МОДУЛЬ 1: ГЕНЕРАТОР ЗАДАЧ                                   -->
<!-- ============================================================ -->
<script>
    const TaskGenerator = (function() {
        const CARDS_COUNT = 8;
        const WRONG_COUNT = CARDS_COUNT - 1;
        const MAX_ATTEMPTS = 10;

        function formatInterval(left, right, leftInc, rightInc) {
            if (left === -Infinity) leftInc = false;
            if (right === Infinity) rightInc = false;
            const lb = leftInc ? '[' : '(';
            const rb = rightInc ? ']' : ')';
            const ls = (left === -Infinity) ? '-∞' : left;
            const rs = (right === Infinity) ? '+∞' : right;
            return `${lb}${ls}, ${rs}${rb}`;
        }

        // Проверка, что интервал валиден (левая граница не больше правой)
        function isValidInterval(l, r, lInc, rInc) {
            if (l === r) {
                return lInc && rInc; // [x, x] — валидная точка, (x, x) — пусто
            }
            return l < r;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function flipOp(coef, op) {
            if (coef >= 0) return op;
            return { '>': '<', '<': '>', '≥': '≤', '≤': '≥' }[op];
        }

        function formatRight(d, e) {
            if (d === 0) return `${e}`;
            let s = d === 1 ? 'x' : d === -1 ? '-x' : `${d}x`;
            if (e > 0) s += ` + ${e}`;
            else if (e < 0) s += ` - ${Math.abs(e)}`;
            return s;
        }

        function buildDistractors(correct, pool, tricky = []) {
            // Оставляем только валидные интервалы
            const all = [...new Set([...pool, ...tricky])].filter(s => s !== correct);
            // Дополнительная проверка на пустоту/невалидность не нужна, т.к. мы фильтруем при создании пула
            shuffle(all);
            const trickyF = tricky.filter(s => s !== correct && !pool.includes(s));
            shuffle(trickyF);
            const priority = trickyF.slice(0, 2);
            const rest = all.filter(s => !priority.includes(s));
            let wrong = [...priority, ...rest.slice(0, WRONG_COUNT - priority.length)];

            if (wrong.length < WRONG_COUNT) {
                const remaining = all.filter(s => !wrong.includes(s));
                for (let i = 0; i < remaining.length && wrong.length < WRONG_COUNT; i++) {
                    wrong.push(remaining[i]);
                }
            }

            return shuffle([correct, ...wrong]);
        }

        function generateEasy() {
            const a = Math.floor(Math.random() * 5) + 1;
            const x0 = Math.floor(Math.random() * 11) - 5;
            const b = Math.floor(Math.random() * 11) - 5;
            const c = a * x0 + b;
            const op = ['>', '<', '≥', '≤'][Math.floor(Math.random() * 4)];
            let correct;
            if (op === '>') correct = formatInterval(x0, Infinity, false, false);
            else if (op === '<') correct = formatInterval(-Infinity, x0, false, false);
            else if (op === '≥') correct = formatInterval(x0, Infinity, true, false);
            else correct = formatInterval(-Infinity, x0, false, true);

            let eq = `${a}x`;
            if (b > 0) eq += ` + ${b}`;
            else if (b < 0) eq += ` - ${Math.abs(b)}`;
            eq += ` ${op} ${c}`;

            // Собираем пул только из валидных интервалов
            const rawPool = [
                { l: x0, r: Infinity, li: true, ri: false },
                { l: x0, r: Infinity, li: false, ri: false },
                { l: -Infinity, r: x0, li: false, ri: true },
                { l: -Infinity, r: x0, li: false, ri: false },
                { l: x0 - 1, r: Infinity, li: false, ri: false },
                { l: x0 + 1, r: Infinity, li: false, ri: false },
                { l: -Infinity, r: x0 - 1, li: false, ri: false },
                { l: -Infinity, r: x0 + 1, li: false, ri: false },
                { l: -x0, r: Infinity, li: false, ri: false },
                { l: -Infinity, r: -x0, li: false, ri: false },
                { l: -x0, r: x0, li: false, ri: false },
            ];
            
            const pool = rawPool
                .filter(p => isValidInterval(p.l, p.r, p.li, p.ri))
                .map(p => formatInterval(p.l, p.r, p.li, p.ri));

            return { equation: eq, correctInterval: correct, options: buildDistractors(correct, pool) };
        }

        function generateHard() {
            for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
                const x0 = Math.floor(Math.random() * 21) - 10;
                const finalOp = ['>', '<', '≥', '≤'][Math.floor(Math.random() * 4)];
                let correct;
                if (finalOp === '>') correct = formatInterval(x0, Infinity, false, false);
                else if (finalOp === '<') correct = formatInterval(-Infinity, x0, false, false);
                else if (finalOp === '≥') correct = formatInterval(x0, Infinity, true, false);
                else correct = formatInterval(-Infinity, x0, false, true);

                const type = Math.floor(Math.random() * 6);
                let left = '', coef = 0, d = 0, e = 0;

                if (type === 0) {
                    const a = -(Math.floor(Math.random() * 5) + 2);
                    const b = Math.floor(Math.random() * 11) - 5;
                    const c = Math.floor(Math.random() * 11) - 10;
                    coef = a + c;
                    left = `${a}(${b} + x)`;
                    if (c !== 0) left += ` ${c > 0 ? '+' : '-'} ${Math.abs(c)}x`;
                    e = coef * x0 + a * b;
                } else if (type === 1) {
                    const a = Math.floor(Math.random() * 8) + 2;
                    const b = Math.floor(Math.random() * 6) + 2;
                    const c = Math.floor(Math.random() * 7) - 3;
                    d = Math.floor(Math.random() * 8) - 4;
                    coef = (a - b) - d;
                    e = coef * x0 + (-b * c);
                    left = `${a}x - ${b}(${c} + x)`;
                } else if (type === 2) {
                    const a = Math.floor(Math.random() * 6) + 3;
                    const b = -(Math.floor(Math.random() * 5) + 3);
                    const c = Math.floor(Math.random() * 5) + 1;
                    d = Math.floor(Math.random() * 11) - 5;
                    coef = (a + b * c) - d;
                    e = coef * x0 + b * (-7);
                    left = `${a}x ${b < 0 ? '-' : '+'} ${Math.abs(b)}(-7 ${c > 0 ? '+' : '-'} ${Math.abs(c)}x)`;
                } else if (type === 3) {
                    const a = -(Math.floor(Math.random() * 3) + 1);
                    const b = Math.floor(Math.random() * 5) + 2;
                    const dd = Math.floor(Math.random() * 5) + 1;
                    d = Math.floor(Math.random() * 11) - 5;
                    coef = (a + b * dd) - d;
                    e = coef * x0 + b * (-7);
                    left = `${a === -1 ? '-' : a}x ${b > 0 ? '+' : '-'} ${Math.abs(b)}(-7 + ${dd}x)`;
                } else if (type === 4) {
                    const a = Math.floor(Math.random() * 7) + 2;
                    const b = Math.floor(Math.random() * 4) + 2;
                    const c = -(Math.floor(Math.random() * 7) + 1);
                    const dd = -(Math.floor(Math.random() * 5) + 2);
                    d = Math.floor(Math.random() * 11) - 5;
                    coef = (a + b * dd) - d;
                    e = coef * x0 + b * c;
                    left = `${a}x + ${b}(${c} ${dd > 0 ? '+' : '-'} ${Math.abs(dd)}x)`;
                } else {
                    const a = Math.floor(Math.random() * 5) + 2;
                    const b = Math.floor(Math.random() * 4) + 2;
                    const c = -(Math.floor(Math.random() * 7) + 3);
                    const dd = Math.floor(Math.random() * 7) + 1;
                    d = -(Math.floor(Math.random() * 7) + 2);
                    coef = (a + b * dd) - d;
                    e = coef * x0 + b * c;
                    left = `${a}x + ${b}(${c} + ${dd}x)`;
                }

                if (coef === 0) continue;

                const op = flipOp(coef, finalOp);
                const right = formatRight(d, e);
                const eq = `${left} ${op} ${right}`;

                // Собираем сырые интервалы и фильтруем невалидные
                const rawPool = [
                    { l: x0, r: Infinity, li: true, ri: false },
                    { l: x0, r: Infinity, li: false, ri: false },
                    { l: -Infinity, r: x0, li: false, ri: true },
                    { l: -Infinity, r: x0, li: false, ri: false },
                    { l: x0 - 1, r: Infinity, li: false, ri: false },
                    { l: x0 + 1, r: Infinity, li: false, ri: false },
                    { l: -Infinity, r: x0 - 1, li: false, ri: false },
                    { l: -Infinity, r: x0 + 1, li: false, ri: false },
                    { l: x0 - 1, r: Infinity, li: true, ri: false },
                    { l: x0 + 1, r: Infinity, li: true, ri: false },
                    { l: -Infinity, r: x0 - 1, li: false, ri: true },
                    { l: -Infinity, r: x0 + 1, li: false, ri: true },
                    { l: -x0, r: Infinity, li: false, ri: false },
                    { l: -x0, r: Infinity, li: true, ri: false },
                    { l: -Infinity, r: -x0, li: false, ri: false },
                    { l: -Infinity, r: -x0, li: false, ri: true },
                    { l: -x0 - 1, r: Infinity, li: false, ri: false },
                    { l: -x0 + 1, r: Infinity, li: false, ri: false },
                    { l: -Infinity, r: -x0 - 1, li: false, ri: false },
                    { l: -Infinity, r: -x0 + 1, li: false, ri: false },
                    { l: -x0, r: x0, li: false, ri: false },
                    { l: -x0, r: x0, li: true, ri: true },
                ];

                const rawTricky = [
                    // Объединения строкой, но валидные
                    { s: `${formatInterval(-Infinity, x0, false, false)} ∪ ${formatInterval(x0, Infinity, false, false)}`, v: true },
                    { s: `${formatInterval(-Infinity, x0 - 1, false, false)} ∪ ${formatInterval(x0 + 1, Infinity, false, false)}`, v: true },
                    { s: `${formatInterval(-Infinity, -x0, false, false)} ∪ ${formatInterval(x0, Infinity, false, false)}`, v: true },
                    { s: formatInterval(x0, x0 + 1, true, true), v: isValidInterval(x0, x0 + 1, true, true) },
                    { s: formatInterval(x0 - 1, x0, true, true), v: isValidInterval(x0 - 1, x0, true, true) },
                    { s: formatInterval(-x0 - 1, -x0, false, false), v: isValidInterval(-x0 - 1, -x0, false, false) },
                    { s: formatInterval(-x0, -x0 + 1, false, false), v: isValidInterval(-x0, -x0 + 1, false, false) },
                ];

                const pool = rawPool
                    .filter(p => isValidInterval(p.l, p.r, p.li, p.ri))
                    .map(p => formatInterval(p.l, p.r, p.li, p.ri));
                
                const tricky = rawTricky.filter(t => t.v).map(t => t.s);

                return { equation: eq, correctInterval: correct, options: buildDistractors(correct, pool, tricky) };
            }
            return generateEasy();
        }

        let easyCounter = 0;
        return {
            next() {
                if (easyCounter < 2) { easyCounter++; return generateEasy(); }
                easyCounter = 0;
                return generateHard();
            }
        };
    })();
</script>

<script>
    const GameUI = (function() {
        const els = {
            scoreDisplay: document.getElementById('scoreDisplay'),
            scoreValue: document.getElementById('scoreValue'),
            inequality: document.getElementById('inequalityDisplay'),
            cardsContainer: document.getElementById('cardsContainer'),
            answerZone: document.getElementById('answerZone'),
            answerPlaceholder: document.getElementById('answerPlaceholder'),
            messageArea: document.getElementById('messageArea'),
            checkBtn: document.getElementById('checkBtn'),
        };

        return {
            els,
            getAnswerZoneRect() {
                return els.answerZone.getBoundingClientRect();
            },
            isPointInAnswerZone(x, y) {
                const r = els.answerZone.getBoundingClientRect();
                return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
            },
            setDragOver(on) {
                els.answerZone.classList.toggle('drag-over', on);
            },
            setScore(n) {
                els.scoreDisplay.textContent = n;
                els.scoreValue.textContent = n;
            },
            renderEquation(eqStr) {
                els.inequality.innerHTML = '';
                eqStr.split(/\s+/).filter(Boolean).forEach((term, i) => {
                    if (i > 0) els.inequality.appendChild(document.createTextNode(' '));
                    const span = document.createElement('span');
                    span.className = 'term';
                    span.textContent = term;
                    els.inequality.appendChild(span);
                });
            },
            renderCards(options, handlers) {
                els.cardsContainer.innerHTML = '';
                options.forEach(opt => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.textContent = opt;
                    card.dataset.value = opt;
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('aria-label', `Промежуток ${opt}`);
                    card.addEventListener('pointerdown', handlers.onPointerDown);
                    card.addEventListener('click', handlers.onClick);
                    card.addEventListener('keydown', handlers.onKeyDown);
                    els.cardsContainer.appendChild(card);
                });
            },
            clearAnswerZone() {
                els.answerZone.querySelectorAll('.card').forEach(c => c.remove());
                els.answerPlaceholder.style.display = '';
            },
            updatePlaceholder(hasCard) {
                els.answerPlaceholder.style.display = hasCard ? 'none' : '';
            },
            setMessage(html) {
                els.messageArea.innerHTML = html;
            },
            setCheckDisabled(disabled) {
                els.checkBtn.disabled = disabled;
            },
            disableAllCards() {
                document.querySelectorAll('.card').forEach(c => c.classList.add('disabled'));
            },
            highlightCorrect(correct) {
                document.querySelectorAll('.card').forEach(c => {
                    if (c.dataset.value === correct) c.classList.add('correct-highlight');
                });
            },
            highlightWrong(card) {
                if (card) card.classList.add('wrong-highlight');
            }
        };
    })();
</script>

<script>
    const DragDropManager = (function() {
        let ui = null;
        let callbacks = null;
        let dragState = null;
        let suppressNextClick = false;

        function onPointerDown(e) {
            const card = e.currentTarget;
            if (card.classList.contains('disabled')) return;
            if (e.pointerType === 'mouse') e.preventDefault();

            const rect = card.getBoundingClientRect();
            const ghost = card.cloneNode(true);
            ghost.classList.add('ghost');
            ghost.style.width = rect.width + 'px';
            ghost.style.height = rect.height + 'px';
            ghost.style.left = rect.left + 'px';
            ghost.style.top = rect.top + 'px';
            document.body.appendChild(ghost);

            card.classList.add('dragging');
            dragState = {
                card, ghost,
                offsetX: e.clientX - rect.left,
                offsetY: e.clientY - rect.top,
                startX: e.clientX, startY: e.clientY,
                moved: false,
            };
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.addEventListener('pointercancel', onPointerCancel);
        }

        function onPointerMove(e) {
            if (!dragState) return;
            if (Math.abs(e.clientX - dragState.startX) > 3 || Math.abs(e.clientY - dragState.startY) > 3) {
                dragState.moved = true;
            }
            dragState.ghost.style.left = (e.clientX - dragState.offsetX) + 'px';
            dragState.ghost.style.top = (e.clientY - dragState.offsetY) + 'px';
            ui.setDragOver(ui.isPointInAnswerZone(e.clientX, e.clientY));
        }

        function endDrag() {
            if (!dragState) return;
            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);
            document.removeEventListener('pointercancel', onPointerCancel);
            ui.setDragOver(false);
            if (dragState.ghost.parentElement) dragState.ghost.remove();
            dragState.card.classList.remove('dragging');
        }

        function onPointerUp(e) {
            if (!dragState) return;
            const { card, moved } = dragState;
            const droppedInZone = ui.isPointInAnswerZone(e.clientX, e.clientY);
            endDrag();
            if (moved) {
                suppressNextClick = true;
                if (droppedInZone) callbacks.onDropInZone(card);
                else callbacks.onDropOutside(card);
            }
            dragState = null;
        }

        function onPointerCancel() {
            if (!dragState) return;
            endDrag();
            dragState = null;
        }

        function onClick(e) {
            if (suppressNextClick) { suppressNextClick = false; return; }
            callbacks.onCardClick(e.currentTarget);
        }

        function onKeyDown(e) {
            callbacks.onCardKeyDown(e);
        }

        return {
            init(uiRef, cbs) {
                ui = uiRef;
                callbacks = cbs;
            },
            resetSuppress() {
                suppressNextClick = false;
            },
            getHandlers() {
                return { onPointerDown, onClick, onKeyDown };
            }
        };
    })();
</script>

<!-- МОДУЛЬ 4: ИГРА                                              -->
<!-- ============================================================ -->
<script>
    const Game = (function(gen, ui, dnd) {
        let currentTask = null;
        let placedCardEl = null;
        let placedCardValue = null;
        let selectedCardEl = null;
        let score = 0;
        let answered = false;
        let resetTimeoutId = null;

        function placeCardInZone(card) {
            if (answered) return;
            if (placedCardEl && placedCardEl !== card) returnCardToPool(placedCardEl);
            card.classList.remove('correct-highlight', 'wrong-highlight', 'disabled', 'selected');
            card.classList.add('placed');
            if (card.parentElement) card.parentElement.removeChild(card);
            ui.els.answerZone.appendChild(card);
            placedCardEl = card;
            placedCardValue = card.dataset.value;
            if (selectedCardEl && selectedCardEl !== card) selectedCardEl.classList.remove('selected');
            selectedCardEl = null;
            ui.updatePlaceholder(true);
        }

        function returnCardToPool(card) {
            card.classList.remove('placed', 'correct-highlight', 'wrong-highlight', 'disabled', 'selected');
            ui.els.cardsContainer.appendChild(card);
            if (placedCardEl === card) { placedCardEl = null; placedCardValue = null; }
            ui.updatePlaceholder(false);
        }

        function toggleCardSelection(card) {
            if (answered || card.classList.contains('disabled')) return;
            if (card.parentElement === ui.els.answerZone) { returnCardToPool(card); return; }
            if (selectedCardEl === card) placeCardInZone(card);
            else {
                if (selectedCardEl) selectedCardEl.classList.remove('selected');
                selectedCardEl = card;
                card.classList.add('selected');
            }
        }

        function onCardKeyDown(e) {
            if (e.key === 'Escape' && selectedCardEl) {
                selectedCardEl.classList.remove('selected');
                selectedCardEl = null;
            } else if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleCardSelection(e.currentTarget);
            }
        }

        function checkAnswer() {
            if (answered) { ui.setMessage('<span class="feedback-error">Вы уже ответили. Нажмите «Новое задание».</span>'); return; }
            if (!placedCardEl) { ui.setMessage('<span class="feedback-error">Сначала перетащите карточку.</span>'); return; }
            const isCorrect = placedCardValue === currentTask.correctInterval;
            answered = true;
            ui.setCheckDisabled(true);
            ui.disableAllCards();
            ui.highlightCorrect(currentTask.correctInterval);
            if (!isCorrect) ui.highlightWrong(placedCardEl);
            if (isCorrect) {
                score++;
                ui.setScore(score);
                ui.setMessage('<span class="feedback-success">Верно!</span>');
            } else {
                // Оборачиваем правильный ответ в span с nowrap
                ui.setMessage(`<span class="feedback-error">Неверно. Правильный: <span class="nowrap-interval"><strong>${currentTask.correctInterval}</strong></span></span>`);
            }
        }

        function newTask() {
            ui.clearAnswerZone();
            placedCardEl = null; placedCardValue = null; selectedCardEl = null;
            dnd.resetSuppress();
            currentTask = gen.next();
            ui.renderEquation(currentTask.equation);
            ui.renderCards(currentTask.options, dnd.getHandlers());
            answered = false;
            ui.setCheckDisabled(false);
            ui.setMessage('');
        }

        function resetScore() {
            score = 0;
            ui.setScore(0);
            if (resetTimeoutId) clearTimeout(resetTimeoutId);
            ui.setMessage('<span style="opacity:0.7;">Счёт сброшен.</span>');
            resetTimeoutId = setTimeout(() => { ui.setMessage(''); resetTimeoutId = null; }, 1500);
        }

        function init() {
            dnd.init(ui, {
                onDropInZone: (card) => placeCardInZone(card),
                onDropOutside: (card) => returnCardToPool(card),
                onCardClick: (card) => toggleCardSelection(card),
                onCardKeyDown: (e) => onCardKeyDown(e),
            });

            document.getElementById('checkBtn').addEventListener('click', checkAnswer);
            document.getElementById('newTaskBtn').addEventListener('click', newTask);
            document.getElementById('resetScoreBtn').addEventListener('click', resetScore);

            ui.els.answerZone.addEventListener('click', (e) => {
                if (e.target === ui.els.answerZone || e.target === ui.els.answerPlaceholder) {
                    if (selectedCardEl) placeCardInZone(selectedCardEl);
                }
            });
            ui.els.answerZone.addEventListener('keydown', (e) => {
                if ((e.key === 'Enter' || e.key === ' ') && selectedCardEl && !answered) {
                    e.preventDefault();
                    placeCardInZone(selectedCardEl);
                }
            });

            document.addEventListener('dragstart', (e) => e.preventDefault());

            newTask();
        }

        return { init };
    })(TaskGenerator, GameUI, DragDropManager);

    Game.init();
</script>
</body>
