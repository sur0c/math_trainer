<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёры по математике</title>
    <style>
        /* Базовые настройки и шрифты */
        :root {
            --bg-color: #f4f7fb; /* Светло-голубой фон страницы */
            --card-bg: #ffffff; /* Белый фон карточек */
            --text-main: #1e293b; /* Темно-синий/серый для текста */
            --text-muted: #64748b; /* Серый для второстепенного текста */
            --accent-color: #1e3a5f; /* Темно-синий (как кнопка "Проверить") */
            --accent-hover: #152a46;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05); /* Мягкая тень */
            --border-radius: 24px; /* Сильное скругление */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
        }

        /* Контейнер */
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        /* Основная карточка */
        .main-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 80px 40px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--accent-color);
        }

        p.subtitle {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 48px;
        }

        /* Кнопка-ссылка */
        .btn-link {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 50px; /* Овальная кнопка */
            font-size: 18px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(30, 58, 95, 0.2);
        }

        .btn-link:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.3);
        }

        .btn-link:active {
            transform: translateY(0);
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Главная карточка -->
        <div class="main-card">
            <h1>Тренажёры по математике</h1>
            <p class="subtitle">Выберите нужный раздел и начните практику</p>
            
            <!-- Ссылка на линейные неравенства -->
            <a href="lin_ner.html" class="btn-link">Линейные неравенства</a>
        </div>
    </div>

</body>
</html>
