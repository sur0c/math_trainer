<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная | Тренажёр уравнений</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            
            /* ТВОЙ ФОН */
            background-image: url('bg.webp'); 
            background-color: #f0f0f0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        .landing-card {
            background: rgba(255, 255, 255, 0.92);
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(6px);
            margin-top: auto;
            margin-bottom: auto;
        }
        
        h1 {
            color: #333;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        
        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .features {
            text-align: left;
            display: inline-block;
            margin-bottom: 30px;
            color: #444;
            font-size: 16px;
        }
        
        .features li {
            margin-bottom: 10px;
        }
        
        /* Группа кнопок */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .start-btn {
            display: block;
            width: 100%;
            max-width: 350px;
            background: #007bff;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
            box-sizing: border-box;
        }
        
        .start-btn:hover {
            background: #0056b3;
        }
        
        .start-btn:active {
            transform: scale(0.98);
        }

        /* Стиль для второй кнопки (линейные уравнения) */
        .start-btn.secondary {
            background: #28a745; /* Зелёный цвет, чтобы отличать от квадратных */
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }
        
        .start-btn.secondary:hover {
            background: #218838;
        }

        .github-link {
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #999;
            text-decoration: none;
            transition: color 0.2s;
            text-shadow: 0 1px 3px rgba(255,255,255,0.8);
        }

        .github-link:hover {
            color: #666;
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .landing-card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 26px;
            }
            p {
                font-size: 16px;
            }
            .start-btn {
                font-size: 16px;
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <h1>Тренажёр уравнений</h1>
        <p>Выбери тип уравнений для тренировки. Решай, вводи ответ и собирай зелёные квадратики!</p>
        
        <ul class="features">
            <li>📈 Автоматическая генерация уравнений</li>
            <li>🧠 Только целые корни</li>
            <li>🟩🟥🟨 Удобная история ответов</li>
        </ul>
        
        <div class="buttons-container">
            <!-- ССЫЛКА НА КВАДРАТНЫЕ УРАВНЕНИЯ -->
            <a href="trainer.html" class="start-btn">Квадратные уравнения 🚀</a>
            
            <!-- ССЫЛКА НА ЛИНЕЙНЫЕ УРАВНЕНИЯ -->
            <a href="lin_ur.html" class="start-btn secondary">Линейные уравнения ➡️</a>
        </div>
    </div>

    <a href="https://github.com/sur0c/my-math/tree/main" class="github-link" target="_blank">Исходный код на GitHub</a>

</body>
</html>
