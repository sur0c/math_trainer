<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная | Тренажёр уравнений</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f0f0f0;
            
            /* Если хочешь картинку и здесь, раскомментируй и поменяй путь */
            /* background-image: url('bg.jpg'); */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        .landing-card {
            background: rgba(255, 255, 255, 0.92);
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(6px);
        }
        
        h1 {
            color: #333;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        
        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .features {
            text-align: left;
            display: inline-block;
            margin-bottom: 30px;
            color: #444;
            font-size: 16px;
        }
        
        .features li {
            margin-bottom: 10px;
        }
        
        .start-btn {
            display: inline-block;
            background: #007bff;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }
        
        .start-btn:hover {
            background: #0056b3;
        }
        
        .start-btn:active {
            transform: scale(0.98);
        }

        /* Адаптация под телефоны */
        @media (max-width: 500px) {
            .landing-card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 26px;
            }
            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <h1>Тренажёр квадратных уравнений</h1>
        <p>Проверь свои навыки решения уравнений! Вводи наименьший корень и зарабатывай зелёные квадратики.</p>
        
        <ul class="features">
            <li>📈 Автоматическая генерация уравнений</li>
            <li>🧠 Только целые корни (никаких сложных дробей)</li>
            <li>🟩🟥🟨 Удобная история ответов</li>
        </ul>
        
        <br>
        <!-- ССЫЛКА НА ТРЕНАЖЁР -->
        <a href="trainer.html" class="start-btn">Начать тренировку 🚀</a>
    </div>

</body>
</html>
